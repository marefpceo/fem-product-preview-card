<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel='stylesheet' href='./style.css'>
  <title>Product preview card component</title>
</head>
<body>
  <div class='wrapper'>
    <article class='card'>
      <picture>
        <source media='(min-width: 48rem)' srcset='./images/image-product-desktop.jpg'>
        <img src='./images/image-product-mobile.jpg' alt='Gabrielle Essence Eau De Parfum perfume'>
      </picture>
      <div class='card-content'>
        <div class='card-header'>
          <p class='text-preset-4'>Perfume</p>
          <h1 class='text-preset-1'>Gabrielle Essence Eau De Parfum</h1>
          <p class='text-preset-3'>
            A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.
          </p>
        </div>
        <div class='card-price'>
          <p class='text-preset-1'>$149.99</p>
          <s class='text-preset-5'>$169.99</s>
        </div>
        <button class='card-button text-preset-2'>
          <img src='./images/icon-cart.svg' alt=''>
          Add to Cart
        </button>
      </div>
    </article>
  </div>
</body>
</html>
